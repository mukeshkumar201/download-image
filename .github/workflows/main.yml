name: Auto Watermark & Drive Upload

on:
  schedule:
    # Ye rozana ek baar chalega (Raat ke 12:00 baje UTC)
    - cron: '0 0 * * *' 
  push:
    branches:
      - main
  workflow_dispatch: # Manual chalane ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Run Watermark Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python bot.py

      - name: Commit & Push History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_urls.txt
          git commit -m "Update scrape history [skip ci]" || echo "No changes"
          git push
