name: Auto Watermark & Drive Upload

on:
  schedule:
    - cron: '3 0,3,6,9,12,15,18,21 * * *'
    - cron: '33 1,4,7,10,13,16,19,22 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # --- YE LINE ADD KARNI HAI ---
    permissions:
      contents: write
    # ----------------------------
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Run Watermark Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python bot.py

      - name: Commit & Push History
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Pehle pull kar lo taaki koi conflict na ho
          git pull origin main --rebase
          touch posted_urls.txt
          git add posted_urls.txt
          git commit -m "Update scrape history [skip ci]" || echo "No changes"
          git push origin main
